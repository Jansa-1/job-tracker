<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>求职投递记录</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="manifest" href="site.webmanifest">
  <meta name="theme-color" content="#e3f2fd">
</head>

<body>

  <!-- Header -->
  <header class="header">
    <h1 class="header-title">📋 求职投递记录</h1>
    <div class="stats-bar" id="statsBar">
      <span class="stat-item">总计 <strong id="statTotal">0</strong></span>
      <span class="stat-divider">|</span>
      <span class="stat-cat">实习 <strong id="statIntern">0</strong></span>
      <span class="stat-cat">秋招 <strong id="statAutumn">0</strong></span>
      <span class="stat-cat">春招 <strong id="statSpring">0</strong></span>
      <span class="stat-cat">日常 <strong id="statDaily">0</strong></span>
      <span class="stat-divider">|</span>
      <span class="stat-status">已投递 <strong id="statSubmitted">0</strong></span>
      <span class="stat-status">面试中 <strong id="statInterview">0</strong></span>
      <span class="stat-status">已Offer <strong id="statOffer">0</strong></span>
    </div>
  </header>

  <!-- Toolbar -->
  <div class="toolbar">
    <div class="toolbar-row">
      <input type="text" class="search-input" id="searchInput" placeholder="🔍 搜索公司名称...">

      <select class="filter-select" id="filterCategory">
        <option value="">全部分类</option>
        <option value="实习">实习</option>
        <option value="秋招">秋招</option>
        <option value="春招">春招</option>
        <option value="日常">日常</option>
      </select>

      <select class="filter-select" id="filterStatus">
        <option value="">全部状态</option>
        <option value="已投递">已投递</option>
        <option value="已笔试待面试">已笔试待面试</option>
        <option value="面试中">面试中</option>
        <option value="已收到offer">已收到offer</option>
      </select>

      <select class="filter-select" id="filterSource">
        <option value="">全部投递源</option>
        <option value="BOSS">BOSS</option>
        <option value="智联">智联</option>
        <option value="官网">官网</option>
        <option value="其他">其他</option>
      </select>

      <select class="filter-select" id="filterLocation">
        <option value="">全部地点</option>
      </select>

    </div>

    <div class="toolbar-row toolbar-actions">
      <button class="btn btn-primary" id="btnAdd">＋ 新增记录</button>
      <button class="btn btn-outline" id="btnExportCSV">📥 导出Excel</button>
      <button class="btn btn-outline" id="btnExportPDF">🖨️ 导出PDF</button>
      <button class="btn btn-outline" id="btnBackup">💾 备份数据</button>
      <button class="btn btn-outline" id="btnRestore">📂 恢复数据</button>
      <button class="btn btn-outline btn-reset" id="btnReset">🔄 恢复默认</button>
      <input type="file" id="restoreFileInput" class="hidden-input" accept=".json">
    </div>

    <div class="toolbar-row result-info" id="resultInfo"></div>
  </div>

  <!-- Desktop Table -->
  <div class="table-container">
    <table class="data-table" id="dataTable">
      <thead>
        <tr>
          <th data-field="company" class="sortable">公司名称 <span class="sort-icon"></span></th>
          <th data-field="category" class="sortable">分类 <span class="sort-icon"></span></th>
          <th data-field="status" class="sortable">状态 <span class="sort-icon"></span></th>
          <th data-field="source" class="sortable">投递源 <span class="sort-icon"></span></th>
          <th data-field="interviewRound" class="sortable">面试阶段 <span class="sort-icon"></span></th>
          <th data-field="location" class="sortable">工作地点 <span class="sort-icon"></span></th>
          <th data-field="salary" class="sortable">薪资 <span class="sort-icon"></span></th>
          <th data-field="internshipDuration" class="sortable">实习时长 <span class="sort-icon"></span></th>
          <th data-field="dailyHours" class="sortable">每天工时 <span class="sort-icon"></span></th>
          <th data-field="lunchBreak" class="sortable">午休 <span class="sort-icon"></span></th>
          <th data-field="restDays" class="sortable">月休 <span class="sort-icon"></span></th>
          <th data-field="overtime" class="sortable">加班 <span class="sort-icon"></span></th>
          <th data-field="socialInsurance" class="sortable">社保 <span class="sort-icon"></span></th>
          <th data-field="createdAt" class="sortable">登记日期 <span class="sort-icon"></span></th>
          <th data-field="updatedAt" class="sortable">修改日期 <span class="sort-icon"></span></th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody id="tableBody">
        <tr class="empty-row"><td colspan="16">暂无记录，点击「新增记录」开始</td></tr>
      </tbody>
    </table>
  </div>

  <!-- Mobile Sort Bar -->
  <div class="sort-bar" id="sortBar"></div>

  <!-- Mobile Cards -->
  <div class="card-list" id="cardList"></div>

  <!-- Add/Edit Modal -->
  <div class="modal-overlay" id="formModal">
    <div class="modal">
      <div class="modal-header">
        <h2 id="modalTitle">新增记录</h2>
        <button class="modal-close" id="btnModalClose">&times;</button>
      </div>
      <form class="modal-body" id="recordForm">
        <input type="hidden" id="recordId">

        <div class="form-row">
          <div class="form-group required">
            <label for="company">公司名称</label>
            <input type="text" id="company" required placeholder="请输入公司名称">
          </div>
          <div class="form-group required">
            <label for="category">投递分类</label>
            <select id="category" required>
              <option value="">请选择</option>
              <option value="实习">实习</option>
              <option value="秋招">秋招</option>
              <option value="春招">春招</option>
              <option value="日常">日常</option>
            </select>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group required">
            <label for="status">投递状态</label>
            <select id="status" required>
              <option value="">请选择</option>
              <option value="已投递">已投递</option>
              <option value="已笔试待面试">已笔试待面试</option>
              <option value="面试中">面试中</option>
              <option value="已收到offer">已收到offer</option>
            </select>
          </div>
          <div class="form-group">
            <label for="source">投递源</label>
            <select id="source">
              <option value="">不填</option>
              <option value="BOSS">BOSS</option>
              <option value="智联">智联</option>
              <option value="官网">官网</option>
              <option value="其他">其他（请手动输入）</option>
            </select>
            <input type="text" class="custom-input" id="sourceCustom" placeholder="自定义投递源" style="display:none;margin-top:4px">
          </div>
          <div class="form-group" id="interviewRoundGroup" style="display:none">
            <label for="interviewRound">面试阶段</label>
            <select id="interviewRound">
              <option value="1">一面</option>
              <option value="2">二面</option>
              <option value="3">三面</option>
              <option value="4">四面</option>
              <option value="5">五面</option>
              <option value="6">六面</option>
              <option value="7">七面</option>
              <option value="8">八面</option>
              <option value="9">九面</option>
            </select>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="location">工作地点</label>
            <select id="location">
              <option value="">不填</option>
              <optgroup label="一线城市">
                <option value="北京">北京</option>
                <option value="上海">上海</option>
                <option value="广州">广州</option>
                <option value="深圳">深圳</option>
              </optgroup>
              <optgroup label="新一线城市">
                <option value="杭州">杭州</option>
                <option value="成都">成都</option>
                <option value="武汉">武汉</option>
                <option value="南京">南京</option>
                <option value="西安">西安</option>
                <option value="重庆">重庆</option>
                <option value="苏州">苏州</option>
                <option value="天津">天津</option>
                <option value="长沙">长沙</option>
                <option value="郑州">郑州</option>
              </optgroup>
              <optgroup label="其他城市">
                <option value="青岛">青岛</option>
                <option value="大连">大连</option>
                <option value="厦门">厦门</option>
                <option value="合肥">合肥</option>
                <option value="济南">济南</option>
                <option value="福州">福州</option>
                <option value="昆明">昆明</option>
                <option value="贵阳">贵阳</option>
                <option value="南宁">南宁</option>
                <option value="海口">海口</option>
                <option value="哈尔滨">哈尔滨</option>
                <option value="长春">长春</option>
                <option value="沈阳">沈阳</option>
                <option value="石家庄">石家庄</option>
                <option value="太原">太原</option>
                <option value="兰州">兰州</option>
                <option value="乌鲁木齐">乌鲁木齐</option>
                <option value="呼和浩特">呼和浩特</option>
                <option value="其他">其他</option>
              </optgroup>
            </select>
          </div>
          <div class="form-group">
            <label for="salary">大概薪资 (k/月)</label>
            <input type="text" id="salary" placeholder="如：15 或 面议">
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="internshipDuration">实习时长</label>
            <select id="internshipDuration">
              <option value="">不填</option>
              <option value="3个月">3个月</option>
              <option value="6个月">6个月</option>
              <option value="其他">其他（请手动输入）</option>
            </select>
            <input type="text" class="custom-input" id="internshipDurationCustom" placeholder="自定义时长" style="display:none;margin-top:4px">
          </div>
          <div class="form-group">
            <label for="dailyHours">每天工作时长</label>
            <select id="dailyHours">
              <option value="">不填</option>
              <option value="8h">8h</option>
              <option value="10h">10h</option>
              <option value="其他">其他（请手动输入）</option>
            </select>
            <input type="text" class="custom-input" id="dailyHoursCustom" placeholder="自定义时长" style="display:none;margin-top:4px">
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="lunchBreak">午休时长</label>
            <select id="lunchBreak">
              <option value="">不填</option>
              <option value="无">无</option>
              <option value="0.5h">0.5h</option>
              <option value="1h">1h</option>
              <option value="1.5h">1.5h</option>
              <option value="2h">2h</option>
              <option value="2.5h">2.5h</option>
              <option value="其他">其他（请手动输入）</option>
            </select>
            <input type="text" class="custom-input" id="lunchBreakCustom" placeholder="自定义午休" style="display:none;margin-top:4px">
          </div>
          <div class="form-group">
            <label for="restDays">月休情况</label>
            <select id="restDays">
              <option value="">不填</option>
              <option value="单休">单休</option>
              <option value="双休">双休</option>
              <option value="大小周">大小周</option>
              <option value="月休2天">月休2天</option>
              <option value="其他">其他（请手动输入）</option>
            </select>
            <input type="text" class="custom-input" id="restDaysCustom" placeholder="自定义休息" style="display:none;margin-top:4px">
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="overtime">加班情况</label>
            <input type="text" id="overtime" placeholder="如：不加班 / 偶尔加班 / 996">
          </div>
          <div class="form-group">
            <label for="socialInsurance">社保情况</label>
            <input type="text" id="socialInsurance" placeholder="如：五险一金 / 仅五险 / 无">
          </div>
        </div>

        <div class="form-actions">
          <button type="button" class="btn btn-cancel" id="btnCancel">取消</button>
          <button type="submit" class="btn btn-primary">保存</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Delete Confirm Dialog -->
  <div class="modal-overlay" id="confirmModal">
    <div class="modal modal-sm">
      <div class="modal-header">
        <h2>确认删除</h2>
        <button class="modal-close" id="btnConfirmClose">&times;</button>
      </div>
      <div class="modal-body">
        <p>确定要删除 <strong id="confirmCompany"></strong> 的投递记录吗？</p>
        <p class="text-muted">此操作不可撤销。</p>
        <div class="form-actions">
          <button type="button" class="btn btn-cancel" id="btnConfirmCancel">取消</button>
          <button type="button" class="btn btn-danger" id="btnConfirmDelete">确认删除</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

</body>

</html>
